services:
  postgres:
    image: postgres:16-alpine
    container_name: oskolok-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oskolok}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oskolok_secret}
      POSTGRES_DB: ${POSTGRES_DB:-oskolok}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oskolok} -d ${POSTGRES_DB:-oskolok}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oskolok-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-oskolok}:${POSTGRES_PASSWORD:-oskolok_secret}@postgres:5432/${POSTGRES_DB:-oskolok}?schema=public
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}

volumes:
  postgres_data:
    driver: local
