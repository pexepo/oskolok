services:
  backend:
    build: .
    container_name: oskolok-backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: file:/var/lib/oskolok/oskolok.db
      PRIVATE_DIR: /var/lib/oskolok/private
      USER_CONTENT_DIR: /var/lib/oskolok/user-content
      PYTHON_PATH: /opt/venv/bin/python
      FFMPEG_PATH: /usr/bin/ffmpeg
      CORS_ORIGIN: ${CORS_ORIGIN:-https://oskolok.lol}
    volumes:
      - oskolok_data:/var/lib/oskolok
volumes:
  oskolok_data:
