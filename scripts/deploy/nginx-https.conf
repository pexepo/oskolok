server {
    listen 80;
    listen [::]:80;
    server_name oskolok.lol;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/oskolok-acme;
        try_files $uri =404;
    }
    location / { return 301 https://oskolok.lol$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name oskolok.lol;
    ssl_certificate /etc/letsencrypt/live/oskolok.lol/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oskolok.lol/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:OskolokSSL:10m;
    server_tokens off;
    client_max_body_size 82m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 4;
    gzip_types application/json text/css application/javascript image/svg+xml;
    location ~ ^/downloads/(Oskolok-Setup\.exe|Oskolok-Portable\.exe|Oskolok\.apk|Oskolok-arm64\.dmg|Oskolok-x64\.dmg)$ {
        alias /var/www/oskolok-downloads/$1;
        types { }
        default_type application/octet-stream;
        add_header Content-Disposition attachment;
        add_header Cache-Control no-cache;
    }
    location /downloads/ { return 404; }
    location ~ /\. { return 404; }
    location ~* ^/(prisma|server|node_modules|data|electron|scripts)(/|$) { return 404; }
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
