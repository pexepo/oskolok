server {
    listen 80;
    listen [::]:80;
    server_name oskolok.lol;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/oskolok-acme;
        try_files $uri =404;
    }
    location / {
        default_type text/plain;
        return 503 "Oskolok is being configured. Please come back shortly.\n";
    }
}
